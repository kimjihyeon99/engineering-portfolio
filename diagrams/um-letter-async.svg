mily="Arial,'Noto Sans KR',sans-serif" font-size="15" font-weight="600" fill="#182B45">내부 DB 상태 조회</text><rect x="860" y="155" width="220" height="80" rx="14" fill="#DFF7EA" stroke="#328D60" stroke-width="2"/><text x="970" y="196" text-anchor="middle" dominant-baseline="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" font-weight="600" fill="#182B45">현재 저장 상태 표시</text><rect x="320" y="360" width="220" height="80" rx="14" fill="#FFF2D9" stroke="#C48A2C" stroke-width="2"/><text x="430" y="401" text-anchor="middle" dominant-baseline="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" font-weight="600" fill="#182B45">@Async 결과 확인</text><rect x="590" y="360" width="220" height="80" rx="14" fill="#EDE9FE" stroke="#7C63C8" stroke-width="2"/><text x="700" y="401" text-anchor="middle" dominant-baseline="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" font-weight="600" fill="#182B45">TMS 메일 전송 결과 조회</text><rect x="860" y="360" width="220" height="80" rx="14" fill="#DFF7EA" stroke="#328D60" stroke-width="2"/><text x="970" y="401" text-anchor="middle" dominant-baseline="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" font-weight="600" fill="#182B45">확정 결과 DB 반영</text><rect x="590" y="535" width="220" height="80" rx="14" fill="#FDE8E8" stroke="#C65D62" stroke-width="2"/><text x="700" y="576" text-anchor="middle" dominant-baseline="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" font-weight="600" fill="#182B45">미확정: 빈 상태 유지</text><rect x="50" y="535" width="220" height="80" rx="14" fill="#FDE8E8" stroke="#C65D62" stroke-width="2"/><text x="160" y="576" text-anchor="middle" dominant-baseline="middle" font-family="Arial,'Noto Sans KR',sans-serif" font-size="15" font-weight="600" fill="#182B45">미확정 시 재전송 차단</text><text x="50" y="660" font-family="Arial,'Noto Sans KR',sans-serif" font-size="13" fill="#64748B">※ DB 갱신은 화면에 자동 Push되지 않음. 화면 재진입 시 React Query가 다시 조회함.</text></svg>