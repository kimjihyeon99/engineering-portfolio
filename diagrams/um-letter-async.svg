<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690"><rect width="1160" height="690" fill="#fff"/><text x="50" y="54" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#182B45">UM Letter · 전송 결과 비동기 확인</text><text x="50" y="85" font-family="Arial,sans-serif" font-size="15" fill="#64748B">화면 조회와 외부 TMS 결과 확인을 분리한 처리 흐름</text><rect x="30" y="115" width="1100" height="160" rx="18" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="30" y="320" width="1100" height="310" rx="18" fill="#FCFCFF" stroke="#E2E8F0"/><text x="50" y="136" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#475569">01 · 사용자 조회 (화면 진입 / 재진입 시 재조회)</text><text x="50" y="342" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#475569">02 · 백그라운드 결과 확인</text><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M1 1 L7 4 L1 7" fill="none" stroke="#64748B" stroke-width="1.4"/></marker></defs><path d="M270 195 H320" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><text x="295" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">상태 조회</text><path d="M540 195 H590" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><text x="565" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">DB 조회</text><path d="M810 195 H860" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><text x="835" y="182" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">상태 반환</text><path d="M430 240 V360" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><text x="453" y="302" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#475569">비동기 시작</text><path d="M540 400 H590" fill="none" stroke="#64748B" stroke-width="2" marker-end="url(#arr)"/><text x="565" y="388" text-anchor="middle" font-family="Arial,sans-s